name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  linux-x86:
    name: Linux x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build in Ubuntu 20.04
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:20.04 bash -c '
            set -e
            dpkg --add-architecture i386
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              cmake g++-multilib make libboost-thread-dev:i386 libboost-chrono-dev:i386 \
              libboost-date-time-dev:i386 libboost-system-dev:i386 libboost-atomic-dev:i386 \
              libssl-dev:i386 zlib1g-dev:i386
            make all
            make check
            if readelf -d bin/mysql_static.so | grep -Eq "libssl\\.so|libcrypto\\.so"; then
              echo "mysql_static.so must not depend on a system OpenSSL library"
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-linux-x86
          path: |
            bin/mysql.so
            bin/mysql_static.so

  integration-linux-x86:
    name: Integration (${{ matrix.db }})
    needs: linux-x86
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.4', 'mysql:5.7', 'mariadb:11.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: itpass
          MYSQL_DATABASE: samp_test
          MARIADB_ROOT_PASSWORD: itpass
          MARIADB_DATABASE: samp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pitpass --silent || mariadb-admin ping -h127.0.0.1 -uroot -pitpass --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: mysql-plugin-linux-x86
          path: bin
      - name: Run against a live server
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e MYSQL_TEST_HOST=127.0.0.1 -e MYSQL_TEST_PORT=3306 -e MYSQL_TEST_USER=root \
            -e MYSQL_TEST_PASSWORD=itpass -e MYSQL_TEST_DATABASE=samp_test \
            ubuntu:20.04 bash -c '
              set -e
              dpkg --add-architecture i386
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                g++-multilib make libssl1.1:i386 zlib1g:i386
              make check-integration
            '
      - name: Upload plugin log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-log-${{ strategy.job-index }}
          path: bin/mysql_log.txt
          if-no-files-found: ignore

  windows-x86:
    name: Windows x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install boost-headers boost-variant boost-lockfree boost-spirit boost-atomic boost-chrono boost-date-time boost-system boost-thread openssl --triplet x86-windows-static-md
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/windows -A Win32 -DCMAKE_BUILD_TYPE=Release -Wno-dev -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static-md 2>&1 | Tee-Object -FilePath build/windows/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --target mysql_plugin --parallel 2>&1 | Tee-Object -FilePath build/windows/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-diagnostics
          path: |
            build/windows/configure.log
            build/windows/build.log
            build/windows/CMakeFiles/CMakeError.log
            build/windows/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-windows-x86
          path: build/windows/Release/mysql.dll
