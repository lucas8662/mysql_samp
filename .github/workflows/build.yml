name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  linux-x86:
    name: Linux x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test in Ubuntu 20.04
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:20.04 bash -c '
            set -e
            dpkg --add-architecture i386
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              g++-multilib make libssl-dev:i386 zlib1g-dev:i386 python3-pip
            # Ubuntu 20.04 ships CMake 3.16; the project needs 3.20+.
            pip3 install -q "cmake==3.27.9"
            cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release -Wno-dev
            cmake --build build/linux --parallel
            ctest --test-dir build/linux --output-on-failure
            if readelf -d bin/mysql_static.so | grep -Eq "libssl\.so|libcrypto\.so"; then
              echo "mysql_static.so must not depend on a system OpenSSL library"
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-linux-x86
          path: |
            bin/mysql.so
            bin/mysql_static.so
      - uses: actions/upload-artifact@v4
        with:
          name: integration-test-linux-x86
          path: bin/mysql_integration

  integration-linux-x86:
    name: Integration (${{ matrix.db }})
    needs: linux-x86
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.4', 'mysql:5.7', 'mariadb:11.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: itpass
          MYSQL_DATABASE: samp_test
          MARIADB_ROOT_PASSWORD: itpass
          MARIADB_DATABASE: samp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pitpass --silent || mariadb-admin ping -h127.0.0.1 -uroot -pitpass --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mysql-plugin-linux-x86
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: integration-test-linux-x86
          path: bin
      - name: Run against a live server
        run: |
          chmod +x bin/mysql_integration
          # Runtime libraries only, like a production server.
          docker run --rm --network host -v "$GITHUB_WORKSPACE/bin:/plugin" -w /plugin \
            -e MYSQL_TEST_HOST=127.0.0.1 -e MYSQL_TEST_PORT=3306 -e MYSQL_TEST_USER=root \
            -e MYSQL_TEST_PASSWORD=itpass -e MYSQL_TEST_DATABASE=samp_test \
            ubuntu:20.04 bash -c '
              set -e
              dpkg --add-architecture i386
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                lib32stdc++6 libssl1.1:i386
              ./mysql_integration ./mysql.so
              ./mysql_integration ./mysql_static.so
            '
      - name: Upload plugin log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-log-${{ strategy.job-index }}
          path: bin/mysql_log.txt
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: itpass
          MYSQL_DATABASE: samp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pitpass --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: itpass
      MYSQL_TEST_DATABASE: samp_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: AddressSanitizer + UBSan + LeakSanitizer (32-bit, as released)
        if: matrix.sanitizer == 'address'
        run: |
          # SYS_PTRACE lets LeakSanitizer inspect the process at exit.
          docker run --rm --cap-add SYS_PTRACE --network host -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e MYSQL_TEST_HOST -e MYSQL_TEST_PORT -e MYSQL_TEST_USER -e MYSQL_TEST_PASSWORD -e MYSQL_TEST_DATABASE \
            ubuntu:20.04 bash -c '
              set -e
              dpkg --add-architecture i386
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                g++-multilib make libssl-dev:i386 zlib1g-dev:i386 python3-pip
              pip3 install -q "cmake==3.27.9"
              tests/run-sanitizers.sh address
            '
      - name: ThreadSanitizer (64-bit test build, Clang)
        if: matrix.sanitizer == 'thread'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libssl-dev zlib1g-dev
          # Clang 14's TSan cannot map its shadow memory with the runner
          # kernel's default ASLR entropy.
          sudo sysctl vm.mmap_rnd_bits=28
          tests/run-sanitizers.sh thread

  windows-x86:
    name: Windows x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl --triplet x86-windows-static-md
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/windows -A Win32 -DCMAKE_BUILD_TYPE=Release -Wno-dev -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static-md 2>&1 | Tee-Object -FilePath build/windows/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --target mysql_plugin --parallel 2>&1 | Tee-Object -FilePath build/windows/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-diagnostics
          path: |
            build/windows/configure.log
            build/windows/build.log
            build/windows/CMakeFiles/CMakeError.log
            build/windows/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-windows-x86
          path: build/windows/Release/mysql.dll
