name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  linux-x86:
    name: Linux x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build in Ubuntu 20.04
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:20.04 bash -c '
            set -e
            dpkg --add-architecture i386
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              cmake g++-multilib make libboost-thread-dev:i386 libboost-chrono-dev:i386 \
              libboost-date-time-dev:i386 libboost-system-dev:i386 libboost-atomic-dev:i386 \
              libssl-dev:i386 zlib1g-dev:i386
            make all
            if readelf -d bin/mysql_static.so | grep -Eq "libssl\\.so|libcrypto\\.so"; then
              echo "mysql_static.so must not depend on a system OpenSSL library"
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-linux-x86
          path: |
            bin/mysql.so
            bin/mysql_static.so

  windows-x86:
    name: Windows x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install boost-atomic boost-chrono boost-date-time boost-system boost-thread openssl --triplet x86-windows-static-md
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/windows -A Win32 -DCMAKE_BUILD_TYPE=Release -Wno-dev -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static-md 2>&1 | Tee-Object -FilePath build/windows/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --target mysql_plugin --parallel 2>&1 | Tee-Object -FilePath build/windows/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-diagnostics
          path: |
            build/windows/configure.log
            build/windows/build.log
            build/windows/CMakeFiles/CMakeError.log
            build/windows/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-plugin-windows-x86
          path: build/windows/Release/mysql.dll
